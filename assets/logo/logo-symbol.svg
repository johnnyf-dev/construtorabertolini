<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="symGoldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FF5D00" />
    </linearGradient>
    <linearGradient id="symNavyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#symNavyDeep)" stroke="url(#symGoldBright)" stroke-width="4" filter="url(#symbolGlow)" />
  
  <!-- Letra B arquitetônica com brilho -->
  <path d="M30 22 V78 H52 C65 78 72 71 72 61 C72 53 66 49 60 48 C65 47 70 42 70 34 C70 24 63 22 50 22 Z" fill="none" stroke="url(#symGoldBright)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 48 H54" stroke="url(#symGoldBright)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Compassos e reflexo luminoso -->
  <circle cx="50" cy="50" r="42" stroke="url(#symGoldBright)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />
</svg>
