<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente de Ouro Reluzente Intenso com Brilho Superior -->
    <linearGradient id="bertoliniGoldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="65%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#E67E00" />
    </linearGradient>
    <linearGradient id="bertoliniNavyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Filtro de Brilho / Glow Dourado Realçado -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Escudo / Monograma B com Brilho Intenso -->
  <g transform="translate(10, 10)" filter="url(#goldGlow)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#bertoliniNavyDeep)" stroke="url(#bertoliniGoldBright)" stroke-width="3" />
    <!-- Brilho especular no canto do escudo -->
    <path d="M12 12 Q35 8 58 12" stroke="#FFF7CC" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Estrutura do B Arquitetônico com Alta Luminosidade -->
    <path d="M22 17 V53 H36 C45 53 49 48 49 42 C49 37 45 35 40 35 C44 35 47 32 47 26 C47 20 43 17 35 17 Z" fill="none" stroke="url(#bertoliniGoldBright)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 35 H39" stroke="url(#bertoliniGoldBright)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="50" cy="50" r="1.5" fill="#FFE885"/>
  </g>

  <!-- Tipografia BERTOLINI -->
  <text x="98" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-size="29" font-weight="800" letter-spacing="4" fill="#FFFFFF">
    BERTOLINI
  </text>
  <circle cx="365" cy="36" r="3.5" fill="#FF7700" filter="url(#goldGlow)" />

  <!-- Slogan / Subtítulo "CONSTRUINDO SEU SONHO" EM COR LARANJA VIBRANTE -->
  <text x="100" y="67" font-family="'Montserrat', 'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#FF6B00">
    CONSTRUINDO SEU SONHO
  </text>
</svg>
